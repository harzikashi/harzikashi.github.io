<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>垂直滑頁效果</title>

    <!-- CSS 樣式設定 -->
    <style>
        /* 移除網頁原本的邊距 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 避免瀏覽器預設捲動行為干擾動畫 */
        html {
            scroll-behavior: auto;
            overscroll-behavior: none;
        }

        body {
            overflow-x: hidden;
        }

        /* 每個區塊預設佔滿整個瀏覽器畫面 */
        .page {
            height: 100vh;
            width: 100%;

            /* 讓文字水平、垂直置中 */
            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 50px;
            color: white;
        }

        /* 第二個區塊改為兩倍高度 */
        #page2 {
            height: 200vh;
        }

        /* 五個區塊使用不同的背景顏色 */
        #page1 {
            background-color: #3498db;
        }

        #page2 {
            background-color: #2ecc71;
        }

        #page3 {
            background-color: #e67e22;
        }

        #page4 {
            background-color: #9b59b6;
        }

        #page5 {
            background-color: #e74c3c;
        }
    </style>
</head>

<body>

    <!-- HTML：建立五個垂直排列的頁面區塊 -->
    <div class="page" id="page1">第一頁</div>
    <div class="page" id="page2">第二頁</div>
    <div class="page" id="page3">第三頁</div>
    <div class="page" id="page4">第四頁</div>
    <div class="page" id="page5">第五頁</div>

    <!-- 引入 jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>

        // 記錄目前所在的頁數，從第一頁開始
        let currentPage = 0;

        // 記錄動畫是否正在執行
        let isScrolling = false;

        // 記錄是否已經接收過這次滾輪操作
        let wheelActive = false;

        // 儲存滾輪事件計時器
        let wheelTimer = null;

        // 設定滾輪事件停止的判斷時間
        const wheelDelay = 120;

        // 取得所有頁面區塊
        let pages = $(".page");

        // 取得網頁捲動容器
        let scroller = document.scrollingElement;


        // 判斷滾輪操作是否已經結束
        function resetWheelLock() {

            // 清除之前的計時器
            clearTimeout(wheelTimer);

            // 滾輪停止 120 毫秒後解除鎖定
            wheelTimer = setTimeout(function() {
                wheelActive = false;
            }, wheelDelay);

        }


        // 執行整頁滑動動畫
        function moveToPage(targetPage, targetPosition) {

            // 如果動畫正在執行，就不接受新操作
            if (isScrolling) {
                return;
            }

            // 開始動畫前鎖定操作
            isScrolling = true;

            // 鎖定這次滾輪操作
            wheelActive = true;

            // 設定滾輪事件解除時間
            resetWheelLock();

            // 如果沒有指定位置，就取得目標區塊頂端位置
            if (targetPosition === undefined) {
                targetPosition = pages.eq(targetPage).offset().top;
            }

            // 執行 jQuery 滑頁動畫
            $(scroller).stop(true, false).animate({

                scrollTop: targetPosition

            }, 700, function() {

                // 動畫結束後再次校正捲動位置
                scroller.scrollTop = targetPosition;

                // 更新目前所在的區塊索引
                currentPage = targetPage;

                // 動畫完成後解除鎖定
                isScrolling = false;

            });

        }


        // 監聽滑鼠滾輪事件
        document.addEventListener("wheel", function(event) {

            // 取得滾輪方向
            let delta = event.deltaY;

            // 忽略沒有移動的事件
            if (delta === 0) {
                return;
            }

            // 如果動畫正在執行，忽略新的滾輪事件
            if (isScrolling) {

                event.preventDefault();

                resetWheelLock();

                return;
            }

            // 如果同一次滾輪操作已經被接收，忽略後續事件
            if (wheelActive) {

                event.preventDefault();

                resetWheelLock();

                return;
            }


            // =================================
            // 第二頁：使用一般自由捲動
            // =================================

            if (currentPage === 1) {

                // 取得第二頁頂部的位置
                let secondTop = pages.eq(1).offset().top;

                // 計算第二頁底部對齊瀏覽器視窗時的位置
                let secondBottom =
                    secondTop +
                    pages.eq(1).outerHeight() -
                    $(window).height();

                // 取得目前網頁的捲動位置
                let currentScroll = scroller.scrollTop;

                // 向下捲動，且已經到達第二頁底部
                if (delta > 0 && currentScroll >= secondBottom - 2) {

                    // 阻止瀏覽器繼續自由捲動
                    event.preventDefault();

                    // 使用整頁動畫進入第三頁
                    moveToPage(2);

                    return;
                }

                // 向上捲動，且已經到達第二頁頂部
                if (delta < 0 && currentScroll <= secondTop + 2) {

                    // 阻止瀏覽器繼續自由捲動
                    event.preventDefault();

                    // 使用整頁動畫回到第一頁
                    moveToPage(0);

                    return;
                }

                // 第二頁中間區域不攔截事件
                // 保留瀏覽器原本的一般捲動方式
                return;

            }


            // =================================
            // 其他頁面：維持原本整頁滑動
            // =================================

            // 阻止瀏覽器原本的捲動行為
            event.preventDefault();

            // 計算目標區塊
            let targetPage = currentPage;

            if (delta > 0) {

                // 向下滑動：前往下一頁
                targetPage++;

            } else if (delta < 0) {

                // 向上滑動：回到上一頁
                targetPage--;

            }

            // 限制頁數在第一頁到第五頁之間
            targetPage = Math.max(0, Math.min(targetPage, 4));

            // 如果已經到達最上方或最下方，就不執行動畫
            if (targetPage === currentPage) {
                return;
            }


            // =================================
            // 從第三頁返回第二頁的特殊處理
            // =================================

            if (currentPage === 2 && targetPage === 1) {

                // 取得第二頁底部對齊視窗時的捲動位置
                let secondTop = pages.eq(1).offset().top;

                let secondBottom =
                    secondTop +
                    pages.eq(1).outerHeight() -
                    $(window).height();

                // 使用動畫進入第二頁底部
                moveToPage(1, secondBottom);

                return;
            }


            // 其他區塊維持原本的整頁滑動動畫
            moveToPage(targetPage);

        }, { passive: false });

    </script>

</body>
</html>
