<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>垂直滑頁效果</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: auto;
            overscroll-behavior: none;
        }

        /* 修正：不再使用 body 的 overflow-x: hidden（Safari 容易出怪問題）
           改用 overflow-x: clip，不會建立捲動容器 */
        body {
            overflow-x: clip;
        }

        .page {
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            color: white;
        }

        #page2 { height: 200vh; }

        #page1 { background-color: #3498db; }
        #page2 { background-color: #2ecc71; }
        #page3 { background-color: #e67e22; }
        #page4 { background-color: #9b59b6; }
        #page5 { background-color: #e74c3c; }
    </style>
</head>

<body>

    <div class="page" id="page1">第一頁</div>
    <div class="page" id="page2">第二頁</div>
    <div class="page" id="page3">第三頁</div>
    <div class="page" id="page4">第四頁</div>
    <div class="page" id="page5">第五頁</div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>

        // 動畫是否正在執行
        let isScrolling = false;

        // 目前這次「滾輪手勢」是否已經觸發過翻頁
        let gestureConsumed = false;

        // 滾輪手勢是否進行中（事件間隔小於 wheelDelay 視為同一次手勢）
        let gestureActive = false;

        // 這次手勢開始時的捲動位置
        let gestureStartY = 0;

        let wheelTimer = null;
        const wheelDelay = 120;

        // 判斷「到達邊界」的容許誤差（px）
        const EDGE = 4;

        // 可以自由捲動的頁面索引（第二頁 = 索引 1）
        const FREE_PAGE = 1;
        const LAST_PAGE = 4;

        const pages = $(".page");
        const scroller = document.scrollingElement || document.documentElement;


        // ---------- 工具函式 ----------

        // 取得某一頁頂端的絕對位置
        function pageTop(index) {
            return pages.get(index).getBoundingClientRect().top + scroller.scrollTop;
        }

        // 取得某一頁「底部剛好對齊視窗底部」時的捲動位置
        function pageBottomPos(index) {
            return pageTop(index) + pages.get(index).offsetHeight - window.innerHeight;
        }

        // 修正：依實際捲動位置計算目前頁面，不依賴會失去同步的變數
        function getCurrentPage() {
            const center = scroller.scrollTop + window.innerHeight / 2;
            for (let i = LAST_PAGE; i >= 0; i--) {
                if (center >= pageTop(i)) {
                    return i;
                }
            }
            return 0;
        }

        // 記錄滾輪手勢：事件持續進來就視為同一次手勢
        function trackGesture() {
            if (!gestureActive) {
                gestureActive = true;
                gestureConsumed = false;
                gestureStartY = scroller.scrollTop;
            }

            clearTimeout(wheelTimer);
            wheelTimer = setTimeout(function () {
                gestureActive = false;
                gestureConsumed = false;
            }, wheelDelay);
        }

        // 統一 deltaY 單位為 px
        function normalizeDelta(event) {
            let d = event.deltaY;
            if (event.deltaMode === 1) d *= 16;
            if (event.deltaMode === 2) d *= window.innerHeight;
            return d;
        }


        // ---------- 整頁滑動動畫 ----------

        function moveToPage(targetPosition) {

            if (isScrolling) {
                return;
            }

            isScrolling = true;
            gestureConsumed = true;

            $(scroller).stop(true, false).animate({
                scrollTop: targetPosition
            }, 700, function () {
                scroller.scrollTop = targetPosition;
                isScrolling = false;
            });
        }


        // ---------- 方向處理（滾輪與鍵盤共用） ----------
        // dir：1 = 向下，-1 = 向上
        // amount：這次預期捲動的距離（px）
        // fromKey：是否來自鍵盤（每次按鍵都視為新操作）

        function handleStep(dir, amount, event, fromKey) {

            const cur = getCurrentPage();

            // ===== 第二頁：自由捲動 =====
            // 修正：不再依賴瀏覽器原生捲動（Safari 在這裡會失效），
            // 改成自己攔截事件、手動改 scrollTop。
            if (cur === FREE_PAGE) {

                const top = pageTop(FREE_PAGE);
                const bottom = pageBottomPos(FREE_PAGE);
                const y = scroller.scrollTop;

                event.preventDefault();

                // 已在邊界：只有「從邊界開始的新手勢」才換頁
                if (dir > 0 && y >= bottom - EDGE) {
                    if (fromKey || gestureStartY >= bottom - EDGE) {
                        moveToPage(pageTop(FREE_PAGE + 1));
                    }
                    return;
                }

                if (dir < 0 && y <= top + EDGE) {
                    if (fromKey || gestureStartY <= top + EDGE) {
                        moveToPage(pageTop(FREE_PAGE - 1));
                    }
                    return;
                }

                // 中間區域：手動捲動，並限制在第二頁範圍內
                const next = Math.max(top, Math.min(y + dir * amount, bottom));
                scroller.scrollTop = next;
                return;
            }

            // ===== 其他頁面：整頁滑動 =====
            event.preventDefault();

            const target = Math.max(0, Math.min(cur + dir, LAST_PAGE));

            if (target === cur) {
                return;
            }

            // 從第三頁往上回第二頁：停在第二頁底部
            if (cur === FREE_PAGE + 1 && target === FREE_PAGE) {
                moveToPage(pageBottomPos(FREE_PAGE));
                return;
            }

            moveToPage(pageTop(target));
        }


        // ---------- 滾輪事件 ----------

        document.addEventListener("wheel", function (event) {

            const delta = normalizeDelta(event);

            if (delta === 0) {
                return;
            }

            // 修正：先記錄手勢，且只有「被攔截的事件」才延長手勢計時
            trackGesture();

            // 動畫中，或這次手勢已經翻過頁（慣性事件）→ 忽略
            if (isScrolling || gestureConsumed) {
                event.preventDefault();
                return;
            }

            handleStep(delta > 0 ? 1 : -1, Math.abs(delta), event, false);

        }, { passive: false });


        // ---------- 鍵盤事件（避免方向鍵、空白鍵繞過整頁滑動） ----------

        document.addEventListener("keydown", function (event) {

            let dir = 0;
            let amount = 40;

            switch (event.key) {
                case "ArrowDown":
                    dir = 1;
                    break;
                case "ArrowUp":
                    dir = -1;
                    break;
                case "PageDown":
                    dir = 1;
                    amount = window.innerHeight * 0.875;
                    break;
                case "PageUp":
                    dir = -1;
                    amount = window.innerHeight * 0.875;
                    break;
                case " ":
                    dir = event.shiftKey ? -1 : 1;
                    amount = window.innerHeight * 0.875;
                    break;
                default:
                    return;
            }

            if (isScrolling) {
                event.preventDefault();
                return;
            }

            handleStep(dir, amount, event, true);
        });

        // ---------- 除錯面板：網址後面加 ?debug 才會顯示 ----------
        if (location.search.indexOf("debug") !== -1) {
            const box = document.createElement("div");
            box.style.cssText =
                "position:fixed;top:0;left:0;z-index:9999;background:rgba(0,0,0,.75);" +
                "color:#0f0;font:12px/1.5 monospace;padding:6px 8px;white-space:pre;pointer-events:none";
            document.body.appendChild(box);

            let lastWheel = "-";
            document.addEventListener("wheel", function (e) {
                lastWheel = "dY=" + Math.round(e.deltaY) + " mode=" + e.deltaMode +
                            " prevented=" + e.defaultPrevented;
            }, { passive: true });

            setInterval(function () {
                box.textContent =
                    "page: " + getCurrentPage() +
                    "\nscrollTop: " + Math.round(scroller.scrollTop) +
                    "\nscrollHeight: " + scroller.scrollHeight +
                    "\ninnerHeight: " + window.innerHeight +
                    "\nisScrolling: " + isScrolling +
                    "\nconsumed: " + gestureConsumed +
                    "\ngestureActive: " + gestureActive +
                    "\nscroller: " + scroller.tagName +
                    "\nlast wheel: " + lastWheel;
            }, 100);
        }

    </script>

</body>
</html>
